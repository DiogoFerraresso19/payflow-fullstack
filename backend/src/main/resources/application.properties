spring.application.name=backend

# Conexão com o banco payflow no pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5432/payflow
spring.datasource.username=postgres
spring.datasource.password=sua_senha_aqui

# Criação automática das tabelas pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave secreta usada para assinar os tokens JWT (deve ter pelo menos 32 caracteres)
jwt.secret=payflow-super-secret-key-2026-minimo-32-caracteres-seguros
# Tempo de expiração do token em milissegundos (86400000 = 24 horas)
jwt.expiration=86400000